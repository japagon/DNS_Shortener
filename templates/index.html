<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>DNS Shortener</title>
  <style>
    body{font-family:Arial;margin:40px auto;max-width:600px;}
    input{width:100%;padding:10px;margin-top:10px;}
    button{padding:10px;margin-top:10px;}
    .box{border:1px solid #ccc;padding:20px;border-radius:8px;}
  </style>
</head>
<body>
  <h1>Acortador DNS</h1>

  <div class="box">
    <form method="POST">
      <p>Introduce la URL completa:</p>
      <input type="text" name="url" placeholder="https://www.ejemplo.com">
      <button type="submit">Generar hash</button>
    </form>

    {% if error %}
      <p style="color:red;">{{ error }}</p>
    {% endif %}

{% if hash %}
  <h2>Hash generado:</h2>
  <p><strong>{{ hash }}</strong></p>

  <h3>Prueba tu hash con dig:</h3>
  <pre>dig +short TXT {{ hash }}.{{ domain }}</pre>

  <h3>Enlace directo:</h3>
  <p>
    <a href="/{{ hash }}" target="_blank">
      http://localhost:5000/{{ hash }}
    </a>
  </p>
{% endif %}

  </div>
</body>
</html>
